# leftover idea from T4 days — maybe unused on MI300X
base_model: "Qwen/Qwen2.5-7B-Instruct"
output_dir: "./outputs/qlora_7b"

lora:
  r: 32
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]  # lazy; expand later

train:
  # FIXME: 4bit path on ROCm is the scary bit
  load_in_4bit: true
  bf16: true
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  num_train_epochs: 2
  max_seq_length: 2048

data:
  train_file: "data/train.jsonl"
